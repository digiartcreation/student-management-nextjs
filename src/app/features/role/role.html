<div class="flex flex-col gap-5">

  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h2 class="m-0 text-xl font-extrabold text-gray-900">Role</h2>
      <p class="mt-0.5 text-sm text-gray-500">Assign menu access per user</p>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <div class="relative inline-flex items-center">
        <svg class="pointer-events-none absolute left-3 h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input
          type="text"
          class="w-64 rounded-lg border border-gray-200 bg-white py-2 pr-4 pl-9 text-sm text-gray-700 outline-none transition-colors placeholder:text-gray-400 focus:border-indigo-600"
          placeholder="Search users…"
          [ngModel]="search()"
          (ngModelChange)="search.set($event)"/>
      </div>
      <button class="flex shrink-0 items-center justify-center gap-1.5 rounded-lg border border-gray-200 bg-white p-2 text-red-500 transition-colors hover:bg-red-50 cursor-pointer" title="Export PDF" (click)="exportPdf()">
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
        </svg><span class="text-[11px] font-bold md:hidden">PDF</span>
      </button>
      <button class="flex shrink-0 items-center justify-center gap-1.5 rounded-lg border border-gray-200 bg-white p-2 text-green-600 transition-colors hover:bg-green-50 cursor-pointer" title="Export Excel" (click)="exportExcel()">
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.5h16.5a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H3.75a.75.75 0 01-.75-.75V5.25a.75.75 0 01.75-.75zM3 9.75h18M3 14.25h18M9 4.5v15M15 4.5v15"/>
        </svg><span class="text-[11px] font-bold md:hidden">Excel</span>
      </button>
    </div>
  </div>

  <!-- AG Grid — desktop/tablet -->
  <div #gridWrapper class="hidden overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-[0_1px_3px_rgba(0,0,0,0.05)] md:block">
    <ag-grid-angular
      [theme]="gridTheme.getTheme()"
      style="height:82vh;width:100%"
      [rowData]="filteredRows()"
      [columnDefs]="colDefs"
      [defaultColDef]="defaultColDef"
      [enableCellTextSelection]="true"
      [rowHeight]="52"
      [headerHeight]="44"
      [pagination]="true"
      [paginationPageSize]="20"
      [animateRows]="true"
      (gridReady)="onGridReady($event)"
      (firstDataRendered)="onGridDataChanged()"
      (rowDataUpdated)="onGridDataChanged()"/>
  </div>

  <!-- Cards — mobile -->
  <div class="flex flex-col gap-3 md:hidden">
    @for (row of pagedRows(); track row.id) {
      <div class="flex flex-col gap-3 rounded-2xl border border-gray-100 bg-white p-4 shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
        <div class="flex items-center justify-between">
          <div class="min-w-0">
            <div class="truncate text-sm font-bold text-gray-900">{{ row.username }}</div>
            <div class="mt-0.5 truncate text-xs text-gray-500">{{ row.role }}</div>
          </div>
          <button
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600 disabled:opacity-60"
            title="Save"
            [disabled]="savingId() === row.id"
            (click)="saveRow(row)">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
            </svg>
          </button>
        </div>
        <div class="grid grid-cols-2 gap-2 rounded-lg border border-gray-100 bg-gray-50 p-3">
          @for (menu of menus; track menu) {
            <label class="flex items-center gap-2 text-xs text-gray-700">
              <input
                type="checkbox"
                class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
                [checked]="row[menu]"
                (change)="toggleMobileMenu(row, menu)"/>
              {{ menu }}
            </label>
          }
        </div>
      </div>
    } @empty {
      <div class="flex flex-col items-center gap-2 rounded-2xl border border-gray-100 bg-white px-4 py-10 text-center shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
        <p class="m-0 text-sm font-semibold text-gray-500">No users found</p>
      </div>
    }
    <app-mobile-pagination [total]="filteredRows().length" [page]="mobilePage()" (pageChange)="mobilePage.set($event)"/>
  </div>

</div>
